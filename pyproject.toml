[project]
name = "fraud"
version = "0.1.0"
description = "End-to-end card fraud detection on IEEE-CIS: SQL features, cost-based thresholds, SHAP and LLM analyst notes"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "mlflow>=2.16",
    "shap>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "kaggle>=1.6"]
app = ["streamlit>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
