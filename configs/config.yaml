paths:
  raw_dir: data/raw
  duckdb: data/processed/fraud.duckdb
  features_parquet: data/processed/features.parquet
  eda_dir: reports/eda
  figures_dir: reports/figures

data:
  raw_file: paysim.csv

# Time-based split on PaySim day (step // 24). Day 30 is excluded: it has 282 rows, all fraud,
# which is a simulator artifact. Validation picks the threshold; test is used once at the end.
split:
  train_days: [0, 19]
  valid_days: [20, 24]
  test_days: [25, 29]

features:
  categorical: [type]
  # Main feature set. Leaves out the sender's exact balance, because in PaySim 97.6% of frauds
  # send exactly the full balance and no genuine transaction does: a simulator rule, not behaviour.
  realistic:
    - log_amount
    - hour_of_day
    - empties_orig_account
    - orig_balance_zero
    - dest_balance_zero
    - old_balance_dest
    - dest_txn_count_24h
    - dest_amount_sum_24h
    - dest_prior_txn_count
    - hours_since_prev_dest_txn
  # Added on top of the realistic set to measure how much the simulator artifact inflates scores.
  full_extra:
    - old_balance_orig
    - amount_to_orig_balance

model:
  seed: 42
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 100
  logistic_regression:
    C: 1.0
    max_iter: 2000

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: paysim-fraud

# Business costs used to choose the alert threshold (Phase 4). PaySim amounts are in an
# unnamed currency, so costs are set relative to them.
costs:
  # A missed fraud loses its full amount (no recovery assumed).
  missed_fraud_loss_rate: 1.0
  # Analyst time plus friction for the customer, per alert. About 0.6% of the median genuine
  # payment (about 165,000), similar to a 15-minute review on a typical UK card payment.
  review_cost_per_alert: 1000
  # How many alerts the fraud team can review per day (for example 10 analysts x 50 each).
  daily_alert_capacity: 500
  main_model: lightgbm_realistic_none
  baseline_model: logreg_realistic_balanced

# LLM analyst notes (Phase 5). Notes are generated once and saved; the dashboard only reads them.
notes:
  provider: ollama              # runs locally: free, and no data leaves the machine
  model: llama3.2:3b
  ollama_url: http://127.0.0.1:11434
  max_notes: 200                # spread evenly along the alert queue, highest risk to threshold
  temperature: 0.2
  timeout_seconds: 60
